<div class="sj-login-page">
  <div class="sj-login-panel">
    <div class="sj-login-panel__brand">
      <img src="assets/softjobslogo.jpg" alt="SoftJobs" />
      <h1>SoftJobs Billing</h1>
      <p>Computer sales, services &amp; invoicing — Kallakurichi</p>
    </div>

    <div class="sj-login-panel__form">
      <h2>Sign in</h2>
      <p class="sj-login-panel__hint">Enter your credentials to continue</p>

      <form [formGroup]="loginForm">
        <div class="sj-field">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            class="form-control"
            [class.is-invalid]="fieldError('username')"
            placeholder="Username"
            formControlName="username"
          />
          <span class="sj-error" *ngIf="fieldError('username')">{{ fieldError('username') }}</span>
        </div>

        <div class="sj-field">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            class="form-control"
            [class.is-invalid]="fieldError('password')"
            placeholder="Password"
            formControlName="password"
          />
          <span class="sj-error" *ngIf="fieldError('password')">{{ fieldError('password') }}</span>
        </div>

        <p class="sj-error text-center" *ngIf="loginFailed">Invalid username or password</p>

        <button class="sj-btn sj-btn--primary w-100" type="button" (click)="login()">
          Sign in
        </button>
      </form>

      <p class="sj-login-panel__footer">
        63B Katchery Rd · 9994740907<br />
        © {{ currentYear }} SoftJobs · Mdleware Software Solutions
      </p>
    </div>
  </div>
</div>
