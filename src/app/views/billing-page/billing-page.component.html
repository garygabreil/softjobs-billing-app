<div class="invoice-page">
  <div class="invoice-toolbar no-print">
    <button class="sj-btn sj-btn--outline" (click)="goBack()">← Back</button>
    <button class="sj-btn sj-btn--primary" (click)="print()">Print Bill</button>
  </div>

  <app-invoice-sheet
    [customer_name]="customer_name"
    [customer_address]="customer_address"
    [customer_city]="customer_city"
    [customer_phone_number]="customer_phone_number"
    [billing_date]="billing_date"
    [billing_uniqueNumber]="billing_uniqueNumber"
    [billing_delivery_type]="billing_delivery_type"
    [billing_destination]="billing_destination"
    [billing_grantTotal]="billing_grantTotal"
    [billing_netPay]="billing_netPay"
    [billing_gst]="billing_gst"
    [billing_is_gst]="billing_is_gst"
    [billing_product_information]="billing_product_information"
  ></app-invoice-sheet>
</div>
